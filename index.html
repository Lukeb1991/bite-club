<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite Club</title>
<meta name="description" content="Luke & Gill's food diaries: a Manchester hit list plus sandwich and pizza ratings.">
<meta name="theme-color" content="#E4EEDA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bite Club">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Shrikhand&display=swap">
<style>
/* Layout: phone-first single column (max 760px) on a deli-tile wall; perforated ticket cards with rubber-stamp scores; fixed bottom tab bar + floating Add button; bottom sheets for forms */
:root{
  --bg:#E4EEDA; --tile:#D7E3CB; --surface:#FFFDF7; --surface-2:#F2EFE4; --ink:#1C2230; --ink-soft:#596070;
  --line:#DAD5C5; --track:#E8E3D4;
  --tomato:#D63A27; --on-tomato:#FFF8F0; --mustard:#F0B23A; --on-mustard:#1C2230; --basil:#2B784A; --on-basil:#FFFFFF;
  --map-land:#F6F2E6; --map-water:#9DC6DE; --map-road:#E3DAC6; --map-park:#D2E5C2; --map-label:#666C79; --map-dot:#E7E1D1;
  --t-pizza:#D63A27; --t-sandwich:#D39017; --t-brunch:#D65F8A; --t-burger:#93542E; --t-asian:#0F8E88; --t-italian:#2B784A;
  --t-plates:#7849AE; --t-bakery:#C66E28; --t-pub:#2E69BE; --t-sweet:#B83D95; --t-other:#697083;
  --t-english:#5B6B2E; --t-greek:#1E8FC0; --t-takeaway:#4E5BD6; --t-chicken:#E2711D; --t-thai:#6E9A12; --t-sushi:#E0566E;
  --t-noodles:#9C7A1C; --t-caribbean:#13A35B; --t-mexican:#C8401A; --t-african:#A3522B; --t-fine:#34365C;
  --shadow:0 1px 0 rgb(28 34 48 / .05), 0 12px 26px -18px rgb(28 34 48 / .55);
  --me:#1A73E8; --me-ring:#FFFFFF;
  --logo-edge:#1C2230; --logo-shadow:#1C2230;
  --radius:16px;
  --font-display:"Shrikhand","Cooper Black",Georgia,serif;
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171C; --tile:#1A1E24; --surface:#20242C; --surface-2:#292E37; --ink:#F2EEE4; --ink-soft:#A7ADB8;
    --line:#353A45; --track:#393E49;
    --tomato:#FF6A55; --on-tomato:#1A0E0A; --mustard:#FFC75A; --on-mustard:#1C2230; --basil:#62C389; --on-basil:#0E1A12;
    --map-land:#1D2129; --map-water:#2A5573; --map-road:#353B46; --map-park:#24362A; --map-label:#9AA1AD; --map-dot:#242930;
    --t-pizza:#FF6A55; --t-sandwich:#F2B33F; --t-brunch:#F08AAE; --t-burger:#CA8B5F; --t-asian:#36BDB4; --t-italian:#62C389;
    --t-plates:#A87FDC; --t-bakery:#EE9A52; --t-pub:#70A1EA; --t-sweet:#E277C5; --t-other:#9AA0B0;
    --t-english:#A6B865; --t-greek:#5DB9E6; --t-takeaway:#8C95F0; --t-chicken:#F59A52; --t-thai:#A5CF4A; --t-sushi:#F58A9C;
    --t-noodles:#D2AE4A; --t-caribbean:#4CCB86; --t-mexican:#F0724D; --t-african:#D68B5E; --t-fine:#A6AAE0;
    --shadow:0 1px 0 rgb(0 0 0 / .3), 0 14px 30px -20px rgb(0 0 0 / .9);
    --logo-edge:#F2EEE4; --logo-shadow:rgb(0 0 0 / .55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171C; --tile:#1A1E24; --surface:#20242C; --surface-2:#292E37; --ink:#F2EEE4; --ink-soft:#A7ADB8;
  --line:#353A45; --track:#393E49;
  --tomato:#FF6A55; --on-tomato:#1A0E0A; --mustard:#FFC75A; --on-mustard:#1C2230; --basil:#62C389; --on-basil:#0E1A12;
  --map-land:#1D2129; --map-water:#2A5573; --map-road:#353B46; --map-park:#24362A; --map-label:#9AA1AD; --map-dot:#242930;
  --t-pizza:#FF6A55; --t-sandwich:#F2B33F; --t-brunch:#F08AAE; --t-burger:#CA8B5F; --t-asian:#36BDB4; --t-italian:#62C389;
  --t-plates:#A87FDC; --t-bakery:#EE9A52; --t-pub:#70A1EA; --t-sweet:#E277C5; --t-other:#9AA0B0;
  --t-english:#A6B865; --t-greek:#5DB9E6; --t-takeaway:#8C95F0; --t-chicken:#F59A52; --t-thai:#A5CF4A; --t-sushi:#F58A9C;
  --t-noodles:#D2AE4A; --t-caribbean:#4CCB86; --t-mexican:#F0724D; --t-african:#D68B5E; --t-fine:#A6AAE0;
  --shadow:0 1px 0 rgb(0 0 0 / .3), 0 14px 30px -20px rgb(0 0 0 / .9);
  --logo-edge:#F2EEE4; --logo-shadow:rgb(0 0 0 / .55);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--tile) 1px, transparent 1px), linear-gradient(90deg, var(--tile) 1px, transparent 1px);
  background-size:44px 22px;
  font-family:var(--font-body); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--mustard); outline-offset:2px}
.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.mono{font-family:var(--font-mono)}
.grow{flex:1}

.app{max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:calc(22px + env(safe-area-inset-top, 0px)) calc(150px + env(safe-area-inset-bottom, 0px))}

/* masthead */
.masthead{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{flex:none; width:clamp(44px, 12vw, 62px)}
.logo svg{display:block; width:100%; height:auto}
.wordmark{font-family:var(--font-display); font-weight:400; font-size:clamp(36px, 10vw, 58px); line-height:.95; margin:0; color:var(--tomato); text-shadow:3px 3px 0 var(--mustard); transform:rotate(-2.5deg); transform-origin:left bottom; white-space:nowrap}
.tagline{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:12px 0 0}
.sticker{flex:none; width:68px; height:68px; border-radius:50%; background:var(--mustard); color:var(--on-mustard); border:2px solid var(--ink); display:grid; place-content:center; text-align:center; transform:rotate(11deg); box-shadow:3px 3px 0 var(--ink); font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; line-height:1.15}
.sticker b{font-family:var(--font-display); font-weight:400; font-size:17px; letter-spacing:0; line-height:1.05}

/* view header */
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 12px; flex-wrap:wrap; margin:4px 0 6px}
.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px}
.view-title{font-family:var(--font-display); font-weight:400; font-size:clamp(28px, 7vw, 36px); margin:0; line-height:1.05; text-wrap:balance}
.head-actions{display:flex; gap:8px}
.tally{margin:0 0 14px; font-size:12.5px; color:var(--ink-soft); letter-spacing:.02em; font-variant-numeric:tabular-nums}

/* controls */
.seg{display:inline-flex; background:var(--surface); border:1.5px solid var(--ink); border-radius:999px; padding:3px; gap:2px; max-width:100%}
.seg button{border:0; background:transparent; color:var(--ink); font:650 13.5px/1 var(--font-body); padding:8px 14px; border-radius:999px; cursor:pointer; min-height:34px; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.seg.small button{padding:6px 11px; min-height:30px; font-size:12.5px}
.filters{display:grid; gap:10px; margin-bottom:14px}
.seg-row{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap; overflow:visible}
.chip{flex:none; display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 12px; font:650 13px/1 var(--font-body); cursor:pointer; white-space:nowrap; position:relative}
.chip .dot{width:9px; height:9px; border-radius:50%; background:var(--tc, var(--ink-soft)); flex:none}
.chip[aria-pressed="true"], .chip:has(input:checked){border-color:var(--ink); background:var(--ink); color:var(--surface)}
.chip:has(input:focus-visible){outline:3px solid var(--mustard); outline-offset:2px}
.chip input{position:absolute; opacity:0; pointer-events:none}
.filter-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px}
input[type=search], input[type=text], input[type=url], input[type=date], select, textarea{
  font:500 16px/1.3 var(--font-body); color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; min-width:0; max-width:100%
}
/* iOS Safari sizes date boxes to their own content and spills them over the next field; reset that */
input[type=date]{-webkit-appearance:none; appearance:none; display:block; min-height:45px; text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left; margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
select{max-width:48vw; padding-right:8px}
.form select{max-width:100%}
textarea{resize:vertical; min-height:68px}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--mustard) 55%, transparent)}
::placeholder{color:color-mix(in srgb, var(--ink-soft) 75%, transparent)}
.money{position:relative}
.money span{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:700; color:var(--ink-soft); pointer-events:none}
.money input{padding-left:26px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--ink); background:var(--surface); color:var(--ink); font:700 14.5px/1 var(--font-body); border-radius:999px; padding:11px 18px; cursor:pointer; min-height:44px; text-decoration:none; white-space:nowrap}
.btn svg{width:18px; height:18px; flex:none}
.btn.primary{background:var(--tomato); border-color:var(--tomato); color:var(--on-tomato)}
.btn.small{min-height:36px; padding:7px 13px; font-size:13px}
.btn.small svg{width:16px; height:16px}
.btn:disabled{opacity:.55; cursor:progress}
.btn.danger{border-color:var(--tomato); color:var(--tomato); background:transparent}
.btn.danger[data-armed]{background:var(--tomato); color:var(--on-tomato)}
.icon-btn{display:inline-grid; place-items:center; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; flex:none}
.icon-btn svg{width:18px; height:18px}
.linkish{background:none; border:0; padding:0; color:var(--tomato); font:700 13px var(--font-body); text-decoration:underline; cursor:pointer}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}

.pick{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--mustard); color:var(--on-mustard); border:2px solid var(--ink); border-radius:var(--radius); padding:12px 14px; box-shadow:4px 4px 0 var(--ink); cursor:pointer; margin-bottom:16px; font-size:15px; transition:transform .12s, box-shadow .12s}
.pick:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.pick svg{width:30px; height:30px; flex:none; transform:rotate(-12deg)}
.pick b{font-family:var(--font-display); font-weight:400; font-size:19px; margin-right:4px}

.notice{background:var(--surface); border:1.5px solid var(--tomato); border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:14px}
.notice p{margin:0}

/* cards */
.cards{display:grid; gap:14px}
.place-card{position:relative; overflow:hidden; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:14px 14px 0}
.pc-main{min-width:0}
.pc-kicker{margin:0; font:500 11.5px/1.3 var(--font-mono); text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pc-kicker .dot{width:10px; height:10px; border-radius:50%; background:var(--tc)}
.pp{letter-spacing:.02em}
.pp b{font-weight:500; color:var(--ink)}
.pp i{font-style:normal; opacity:.35}
.ex-tag{font:700 10px/1 var(--font-body); letter-spacing:.08em; text-transform:uppercase; background:var(--mustard); color:var(--on-mustard); padding:4px 6px; border-radius:6px}
.pc-name{font:800 19px/1.2 var(--font-body); margin:6px 0 2px; text-wrap:balance; overflow-wrap:anywhere}
.pc-notes{margin:4px 0 0; color:var(--ink-soft); font-size:14.5px; overflow-wrap:anywhere}
.pc-verdict{margin:8px 0 0; font-size:14.5px; overflow-wrap:anywhere}
.pc-verdict .mono{display:block; color:var(--ink-soft); font-size:12px; margin-top:3px; letter-spacing:.02em}
.pc-actions{grid-column:1/-1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; padding:11px 0 13px; border-top:2px dashed var(--line); position:relative}
.pc-actions::before, .pc-actions::after, .rc-perf::before, .rc-perf::after{content:""; position:absolute; top:-10px; width:18px; height:18px; border-radius:50%; background:var(--bg)}
.pc-actions::before{left:-23px} .pc-actions::after{right:-23px}
.chip-link{display:inline-flex; align-items:center; gap:6px; font:650 13.5px/1 var(--font-body); color:var(--ink); text-decoration:none; padding:9px 12px; border-radius:999px; background:var(--surface-2); min-height:36px}
.chip-link svg{width:16px; height:16px}
.btn-tick{display:inline-flex; align-items:center; gap:6px; background:var(--basil); color:var(--on-basil); border:0; font:700 13.5px/1 var(--font-body); padding:9px 14px; border-radius:999px; cursor:pointer; min-height:36px}
.btn-tick svg{width:16px; height:16px}

.stamp{--s:66px; flex:none; width:var(--s); height:var(--s); border-radius:50%; display:grid; place-content:center; text-align:center; color:var(--tomato); border:2.5px solid var(--tomato); box-shadow:inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--tomato); transform:rotate(-9deg); align-self:start}
.stamp b{font:400 calc(var(--s) * .37)/1 var(--font-display); display:block; font-variant-numeric:tabular-nums}
.stamp small{font:500 calc(var(--s) * .135)/1 var(--font-mono); text-transform:uppercase; letter-spacing:.08em; margin-top:3px; display:block}
.pin-badge{flex:none; align-self:start; width:58px; display:grid; justify-items:center; gap:3px; transform:rotate(7deg); margin-top:2px}
.pin-badge svg{display:block; width:40px; height:auto; filter:drop-shadow(0 2px 0 rgb(28 34 48 / .14))}
.pin-badge small{font:500 9.5px/1 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap}
.k-emoji{font-size:13px; line-height:1; letter-spacing:0}
.stamp.sm{--s:52px}
.stamp.sm small{display:none}

.rate-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr)}
.rc-media{aspect-ratio:16/10; max-width:100%; background:var(--surface-2)}
.rc-media img{width:100%; height:100%; object-fit:cover; display:block}
.rc-body{padding:14px 14px 0; min-width:0; display:grid; gap:12px; align-content:start}
.rc-head{display:flex; gap:12px; justify-content:space-between; align-items:flex-start}
.rc-titles{min-width:0}
.rc-meta{margin:0; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-variant-numeric:tabular-nums}
.rank{color:var(--tomato); font-weight:500}
.rc-titles h3{font:800 19px/1.2 var(--font-body); margin:5px 0 2px; text-wrap:balance; overflow-wrap:anywhere}
.rc-place{margin:0; font-size:14.5px; color:var(--ink-soft); overflow-wrap:anywhere}
.rc-place b{color:var(--ink); font-weight:700}
.style-tag{display:inline-block; margin-top:7px; font:700 11.5px/1 var(--font-body); letter-spacing:.04em; padding:5px 9px; border-radius:999px; border:1.5px solid var(--tomato); color:var(--tomato)}
.standout{margin:0; background:color-mix(in srgb, var(--mustard) 24%, var(--surface)); border-radius:10px; padding:9px 11px; font-size:14.5px; overflow-wrap:anywhere}
.standout b{display:block; font:500 10.5px/1.3 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px}
.bars{list-style:none; margin:0; padding:0; display:grid; gap:7px 22px; grid-template-columns:minmax(0,1fr)}
.bars li{display:grid; grid-template-columns:7.6em minmax(0,1fr) 2.3em; align-items:center; gap:8px; font-size:13.5px}
.b-t{height:7px; border-radius:99px; background:var(--track); overflow:hidden}
.b-t i{display:block; height:100%; background:var(--ink); border-radius:99px}
.bars li.top .b-t i{background:var(--tomato)}
.bars b{font:500 13px var(--font-mono); text-align:right; font-variant-numeric:tabular-nums}
.split{margin:0; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.split b{color:var(--ink); font-weight:500}
.rc-notes{margin:0; font-size:14.5px; overflow-wrap:anywhere}
.rc-perf{position:relative; border-top:2px dashed var(--line); display:flex; justify-content:flex-end; gap:8px; padding:10px 0 12px}
.rc-perf::before{left:-23px} .rc-perf::after{right:-23px}
@media (min-width:620px){
  .rate-card.has-photo{grid-template-columns:230px minmax(0,1fr)}
  .rate-card.has-photo .rc-media{aspect-ratio:auto; height:100%; min-height:220px}
  .rate-card.has-photo .rc-perf::before{display:none}
  .bars.two{grid-template-columns:1fr 1fr}
}

.summary{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); background:var(--ink); color:var(--surface); border-radius:var(--radius); padding:12px 6px; margin-bottom:12px}
.summary div{display:grid; gap:2px; justify-items:center; text-align:center; padding:0 6px; min-width:0}
.summary div + div{border-left:1.5px dashed color-mix(in srgb, var(--surface) 35%, transparent)}
.summary span{font:500 10.5px/1.2 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; opacity:.8}
.summary b{font:400 24px/1.1 var(--font-display); font-variant-numeric:tabular-nums}
.champ{display:flex; align-items:center; gap:14px; background:var(--surface); border:2px solid var(--ink); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; box-shadow:4px 4px 0 var(--mustard)}
.champ > div:not(.stamp){min-width:0; flex:1}
.champ p{margin:0}
.champ .eyebrow{margin:0 0 2px}
.champ h3{margin:0; font:800 17px/1.25 var(--font-body); overflow-wrap:anywhere}
.list-tools{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; align-items:center; margin-bottom:12px}
.shelf{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:6px; scrollbar-width:thin}
.best{flex:none; width:172px; text-align:left; display:grid; gap:3px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; cursor:pointer; color:var(--ink); position:relative}
.best .mono{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--tomato); padding-right:34px}
.best b{font:800 14.5px/1.2 var(--font-body); overflow-wrap:anywhere; padding-right:34px}
.best span:not(.mono){font-size:12.5px; color:var(--ink-soft); overflow-wrap:anywhere}
.best em{position:absolute; top:22px; right:10px; font:400 19px/1 var(--font-display); font-style:normal; color:var(--tomato)}
.style-hint{background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:14px; margin:0; border:1.5px dashed var(--line)}

/* ---------- the Bite Club pin: a pizza slice shaped like a map pin ---------- */
const PIN = (() => {
  const cx = 50, cy = 46, R = 38, f = n => String(Math.round(n * 100) / 100);
  const whole = "M50 114C40 98 12 74 12 46A38 38 0 0 1 88 46C88 74 60 98 50 114Z";
  /* A bite: a circle centred just outside the crust, top right, with a scalloped edge */
  const bitten = (r, dist, deg) => {
    const ang = deg * Math.PI / 180, D = [cx + dist * Math.cos(ang), cy + dist * Math.sin(ang)];
    const a = (R * R - r * r + dist * dist) / (2 * dist), h = Math.sqrt(R * R - a * a);
    const u = [Math.cos(ang), Math.sin(ang)], v = [-u[1], u[0]], M = [cx + a * u[0], cy + a * u[1]];
    const P1 = [M[0] + h * v[0], M[1] + h * v[1]], P2 = [M[0] - h * v[0], M[1] - h * v[1]];
    const angC = p => Math.atan2(p[1] - cy, p[0] - cx), angD = p => Math.atan2(p[1] - D[1], p[0] - D[0]);
    const [B1, B2] = angC(P1) < angC(P2) ? [P1, P2] : [P2, P1];
    const wrap = x => { while (x <= -Math.PI) x += 2 * Math.PI; while (x > Math.PI) x -= 2 * Math.PI; return x; };
    const t1 = angD(B1), toC = Math.atan2(cy - D[1], cx - D[0]);
    let span = wrap(angD(B2) - t1);
    if (Math.abs(wrap(t1 + span / 2 - toC)) > Math.PI / 2) span += span > 0 ? -2 * Math.PI : 2 * Math.PI;
    const pts = [0, 1, 2, 3].map(i => i === 0 ? B1 : i === 3 ? B2 : [D[0] + r * Math.cos(t1 + span * i / 3), D[1] + r * Math.sin(t1 + span * i / 3)]);
    let bite = "";
    for (let i = 1; i < 4; i++) { const rr = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) * 0.56; bite += `A${f(rr)} ${f(rr)} 0 0 0 ${f(pts[i][0])} ${f(pts[i][1])}`; }
    return `M50 114C40 98 12 74 12 46A38 38 0 0 1 ${f(B1[0])} ${f(B1[1])}${bite}A38 38 0 0 1 88 46C88 74 60 98 50 114Z`;

}

function shrinkImage(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { URL.revokeObjectURL(url); resolve(b || file); }, "image/jpeg", 0.82);
      } catch (e) { URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function submitRate() {

function csv(rows) {

}
function csvFor(tab) {

    })]);
}
function saveFile(name, type, data) {

    }

}

}

}

  if (mini && ctx && ctx.kind === "place") {
    const pt = mini.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const m = mini.getScreenCTM(); if (!m) return;
    const p = pt.matrixTransform(m.inverse());
    ctx.pin = {lat: toLat(p.y), lng: toLng(p.x), source: "manual"};
    updatePinStatus(); return;
  }
  const pinEl = e.target.closest("[data-pin]");
  if (pinEl && view.contains(pinEl)) {
    S.sel = S.sel === pinEl.getAttribute("data-pin") ? null : pinEl.getAttribute("data-pin");
    render();
    const card = $("#map-card"); if (card && S.sel) card.scrollIntoView({block: "nearest", behavior: reduceMotion() ? "auto" : "smooth"});
    return;
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.getAttribute("data-act"), v = el.getAttribute("data-v"), id = el.getAttribute("data-id");
  const kind = TAB_KIND[S.tab];
  switch (act) {
    case "close": closeSheet(); break;
    case "hit-mode": S.hitMode = v; prefs.set("hitMode", v); render(); break;
    case "status": S.hf.status = v; S.sel = null; render(); break;
    case "type": S.hf.type = v; S.sel = null; render(); break;
    case "price": S.hf.price = v; S.sel = null; render(); break;
    case "frame":
      S.frame = v; prefs.set("frame", v); if (S.hitMode !== "map") S.hitMode = "map"; render();
      if (googleReady() && G.map) { G.map.setCenter(VIEWS[v].center); G.map.setZoom(VIEWS[v].zoom); }
      break;
    case "near-me": nearMe(); break;
    case "g-search": runGoogleSearch(el.getAttribute("data-for")); break;
    case "g-pick": pickGoogleResult(+v, el.getAttribute("data-for")); break;
    case "rf-link": if (ctx) { ctx.placeId = id; ctx.newPlace = null; $("#rf-suggest").innerHTML = ""; $("#rf-gresults").innerHTML = ""; updateLinkUI(); } break;
    case "rf-unlink": if (ctx) { ctx.placeId = null; ctx.newPlace = null; updateLinkUI(); const i = $("#rf-place"); i.value = ""; i.focus(); } break;
    case "show-place": showPlace(id); break;
    case "wy": S.wy = v; render(); break;
    case "import": openImport(); break;
    case "imp-all": if (ctx && ctx.rows) { const on = v === "1"; ctx.rows.forEach(r => { r.on = on; }); $$("input[data-imp]", sheet).forEach(i => { i.checked = on; }); updateImpCount(); } break;
    case "imp-go": runImport(); break;
    case "imp-template": saveFile("bite-club-import-template.csv", "text/csv", csv([TEMPLATE_HEAD])); break;
    case "pic": openPicture(el.getAttribute("data-kind"), id); break;
    case "pic-share": if (ctx && ctx.blob) saveFile(ctx.src === "wrapped" ? `bite-club-wrapped-${S.wy}.jpg` : `bite-club-${ctx.src}-${today()}.jpg`, "image/jpeg", ctx.blob); break;
    case "pic-text": if (ctx) shareOne(ctx.src, ctx.id); break;
    case "rate-here": openRateForm(el.getAttribute("data-kind"), null, id); break;
    case "reset-filters": S.hf = {status: "all", type: "all", area: "all", price: "all", q: ""}; render(); break;
    case "sort": if (kind) { S.rf[kind].sort = v; render(); } break;
    case "style": if (kind) { S.rf[kind].style = v; render(); window.scrollTo({top: 0, behavior: reduceMotion() ? "auto" : "smooth"}); } break;
    case "pick": pick(); break;
    case "add": if (S.tab === "hitlist") openPlaceForm(null); else openRateForm(kind, null); break;
    case "edit-place": { const p = findItem("places", id); if (p) openPlaceForm(p); break; }
    case "tick": { const p = findItem("places", id); if (p) openTick(p); break; }
    case "edit-sandwich": { const x = findItem("sandwiches", id); if (x) openRateForm("sandwich", x); break; }
    case "edit-pizza": { const x = findItem("pizzas", id); if (x) openRateForm("pizza", x); break; }
    case "share": openShare(); break;
    case "share-one": shareOne(el.getAttribute("data-kind"), id); break;
    case "sh-n": if (ctx) { ctx.n = v; updateShare(); } break;
    case "sh-mode": if (ctx) { ctx.mode = v; updateShare(); } break;
    case "sh-copy": { const ta = $("#sh-text"); copyText(ta.value, ta); break; }
    case "sh-send": { const ta = $("#sh-text"); sendShare({title: "Bite Club picks", text: ta.value}, ta); break; }
    case "export": openExport(); break;
    case "csv": saveFile(`bite-club-${v}-${today()}.csv`, "text/csv", csvFor(v)); break;
    case "backup": if (ctx && ctx.backup) saveFile(`bite-club-backup-${today()}.json`, "application/json", ctx.backup); break;
    case "restore": doRestore(); break;
    case "pin-toggle": {
      const box = $("#pf-minimap"); box.hidden = !box.hidden;
      el.setAttribute("aria-expanded", String(!box.hidden)); el.textContent = box.hidden ? "Adjust pin" : "Hide map";
      if (!box.hidden) { const a = AREA[$("#pf-area").value]; const pin = formPin(); const pt = pin ? {x: X(pin.lng), y: Y(pin.lat)} : a && a.lat != null ? {x: X(a.lng), y: Y(a.lat)} : null; ctx.frame = pt && !inFrame(pt, FRAMES.centre) ? "wide" : "centre"; renderMini(); }
      break;
    }
    case "mini-frame": if (ctx) { ctx.frame = v; renderMini(); } break;
    case "pin-reset": if (ctx) { ctx.pin = null; updatePinStatus(); } break;
    case "photo-remove":
      if (ctx) { cleanupCtx(); ctx.file = null; ctx.previewUrl = null; ctx.removePhoto = true; const pv = $("#rf-preview"); pv.hidden = true; pv.removeAttribute("src"); el.hidden = true; $("#rf-photo-label").textContent = "Add a photo"; $("#rf-photo").value = ""; }
      break;
    case "delete": if (arm(el, "Tap again to delete", "Delete this entry")) deleteCurrent(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !sheetWrap.hidden) { closeSheet(); return; }
  if (e.key === "Enter" && e.target.id === "pf-gq") { e.preventDefault(); runGoogleSearch("pf"); return; }
  if (e.key === "Enter" && e.target.id === "rf-place") { e.preventDefault(); if (googleOn()) runGoogleSearch("rf"); else e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-pin], g[data-act]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "hit-q") { S.hf.q = t.value; S.sel = null; render(); }
  else if (t.id === "rf-place") updateSuggest();
  else if (t.id === "rate-q") { const k = TAB_KIND[S.tab]; if (k) { S.rf[k].q = t.value; render(); } }
  else if (t.type === "range") {
    t.style.setProperty("--p", ((t.value - t.min) / (t.max - t.min) * 100).toFixed(1) + "%");
    const o = document.getElementById(t.id + "-o"); if (o) o.textContent = fmtScore(+t.value);
    updateLive();
  } else if (t.id === "pf-google") updatePinStatus();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "hit-area") { S.hf.area = t.value; S.sel = null; render(); }
  else if (t.id === "pf-area") updatePinStatus();
  else if (t.name === "ptype") { if (!$("#pf-minimap").hidden) renderMini(); }
  else if (t.name === "rstyle") { const h = $("#style-hint"), s = PIZZA_STYLES.find(x => x.id === t.value); if (h && s) { h.hidden = false; h.querySelector("span").textContent = s.h; } }
  else if (t.id === "rf-photo" && ctx) {
    const file = t.files && t.files[0]; if (!file) return;
    if (file.type && !/^image\//.test(file.type)) return formError("That file isn't a photo.");
    cleanupCtx(); ctx.file = file; ctx.removePhoto = false; ctx.previewUrl = URL.createObjectURL(file);
    const pv = $("#rf-preview"); pv.src = ctx.previewUrl; pv.hidden = false;
    $("#rf-photo-remove").hidden = false; $("#rf-photo-label").textContent = "Change photo"; formError("");
  }
  else if (t.id === "restore-file" && ctx) { const f = t.files && t.files[0]; if (f) readRestore(f); t.value = ""; }
  else if (t.id === "imp-file" && ctx) { const fs = [...(t.files || [])]; if (fs.length) readImportFiles(fs); t.value = ""; }
  else if (t.hasAttribute && t.hasAttribute("data-imp") && ctx && ctx.rows) { const r = ctx.rows[+t.getAttribute("data-imp")]; if (r) r.on = t.checked; updateImpCount(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "placeForm") submitPlace();
  else if (id === "tickForm") submitTick();
  else if (id === "rateForm") submitRate();
});
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));

/* ---------- start ---------- */
(async function start() {
  $("#logo").innerHTML = pinSvg({bitten: true, detail: "full", w: 6, edge: "var(--logo-edge)", shadow: "var(--logo-shadow)", tilt: -7});
  const h = location.hash.slice(1);
  if (TABS.includes(h)) S.tab = h; else { const t = prefs.get("tab"); if (TABS.includes(t)) S.tab = t; }
  const hm = prefs.get("hitMode"); if (hm === "map" || hm === "list") S.hitMode = hm;
  const fr = prefs.get("frame"); if (fr && FRAMES[fr]) S.frame = fr;
  render();
  try {
    await Store.open();
    const [places, sandwiches, pizzas, photos] = await Promise.all(STORES.map(s => Store.all(s)));
    S.places = places; S.sandwiches = sandwiches; S.pizzas = pizzas;
    for (const r of photos) { const b = new Blob([r.data], {type: r.type || "image/jpeg"}); PHOTOS.set(r.id, {blob: b, url: URL.createObjectURL(b)}); }
  } catch (e) { S.memOnly = true; }
  S.ready = true;
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
</body>
</html>
